name: ci-doctor

# The CI doctor (.claude/skills/ci-doctor) on a GitHub runner: rung 2 of
# docs/AGENT-POLICY.md's promotion ladder, started by hand from the Actions
# tab. Two jobs, so no job holds an agent and a write credential at once:
#
# - doctor: Claude runs the skill with a read-only GitHub token. It reads
#   ci.py's digest, fixes in a checkout of the repo, runs the failed gate,
#   and records what it would open with tools/plan.py: an artifact.
# - apply: no agent. Checks the plan again (no workflow or ruleset paths,
#   agent/ci-* branches, sizes, nothing already tracked by an open
#   ci-doctor item) and opens draft PRs and issues as oxrok-bot.
#
# Secrets: CLAUDE_CODE_OAUTH_TOKEN (doctor), OXROK_BOT_APP_ID and
# OXROK_BOT_PRIVATE_KEY (apply), CI_DOCTOR_READ_TOKEN (doctor, optional: a
# fine-grained token with read-only Actions, Contents, Issues and Pull
# requests on the org's repos, for reading other repos' job logs).

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Repository whose main-branch CI to diagnose
        type: choice
        options: [oxrok, oxrok-ui, oxrok-website, vusb, management]
        default: oxrok
      since:
        description: How far back to look (24h, 7d)
        default: 7d
  # Rung 3, once the skill meets docs/AGENT-POLICY.md's criteria for it:
  # schedule:
  #   - cron: "17 6 * * *"

permissions: {}

concurrency:
  group: ci-doctor
  cancel-in-progress: false

env:
  REPO: ${{ inputs.repo || 'oxrok' }}
  SINCE: ${{ inputs.since || '7d' }}

jobs:
  doctor:
    name: doctor
    # Only main's skill and tools; a branch could carry other instructions.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      OXROK_CHECKOUTS: checkouts
      GH_TOKEN: ${{ secrets.CI_DOCTOR_READ_TOKEN || github.token }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$SINCE" =~ ^[0-9]{1,3}[hd]$ ]] || { echo "since: e.g. 24h or 7d"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.REPO != 'management'
        with:
          repository: oxrok/${{ env.REPO }}
          path: checkouts/${{ env.REPO }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: env.REPO == 'oxrok' || env.REPO == 'oxrok-ui' || env.REPO == 'vusb'
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest
        if: env.REPO == 'oxrok'
      - name: Commit identity for the agent's fix
        run: |
          git config --global user.name "oxrok CI doctor"
          git config --global user.email "oxrok-bot[bot]@users.noreply.github.com"
      - name: An empty plan
        # Outside the checkout, and a path upload-artifact takes (no "..").
        run: |
          plan="$RUNNER_TEMP/ci-doctor-plan"
          mkdir -p "$plan"
          echo '[]' > "$plan/plan.json"
          echo "CI_DOCTOR_PLAN=$plan" >> "$GITHUB_ENV"
      - name: Digest
        # ci.py is deterministic and takes minutes (it downloads the failed
        # jobs' logs); run it here, not in the agent's session, where a long
        # command gets moved to the background and the run ends waiting.
        run: |
          mkdir -p checkouts
          python3 -I tools/ci.py failures --repo "$REPO" --since "$SINCE" > checkouts/ci-doctor-digest.md
          grep -E '^(# |## |Emulator tier skipped)' checkouts/ci-doctor-digest.md | tee -a "$GITHUB_STEP_SUMMARY"
      - id: claude
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        env:
          # cargo clippy or nextest on oxrok takes minutes; let it finish in
          # the foreground.
          BASH_DEFAULT_TIMEOUT_MS: "1800000"
          BASH_MAX_TIMEOUT_MS: "3600000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job's own token, contents: read; no Claude GitHub App needed.
          github_token: ${{ github.token }}
          allowed_bots: ""
          prompt: |
            Run the CI doctor: the ci-doctor skill, .claude/skills/ci-doctor/SKILL.md
            (read it if the skill does not load). You are running in the ci-doctor
            workflow: follow its "In the workflow" section.
            Repository: ${{ env.REPO }}; since: ${{ env.SINCE }}.
            The digest is already made: read checkouts/ci-doctor-digest.md.
            This session ends when you stop: run every command in the
            foreground and wait for it; never background one or wait for a
            notification.
          # Parsed like a shell line: the tool list is quoted, or the spaces
          # inside Bash(...) rules split it into separate arguments. git is
          # allowed whole: the token is read-only and no checkout keeps
          # credentials, so a push cannot go anywhere.
          claude_args: |
            --max-turns 120
            --disallowedTools WebFetch,WebSearch
            --allowedTools "Skill(ci-doctor),Read,Edit,Write,Glob,Grep,Bash(python3 tools/ci.py failures:*),Bash(python3 tools/ci.py open:*),Bash(python3 tools/ci.py flakes:*),Bash(python3 checkouts/:*),Bash(python3 tools/plan.py:*),Bash(cargo fmt:*),Bash(cargo clippy:*),Bash(cargo nextest run:*),Bash(cargo test:*),Bash(make check:*),Bash(make test:*),Bash(git:*),Bash(cd:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(wc:*),Bash(find:*),Bash(sed -n:*)"
      - name: Report
        # The agent's report (its last message, step 4 of the skill) and the
        # tool calls it was refused: names and the start of the input only.
        # The full output stays off (show_full_output can carry secrets).
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          {
            echo "## The doctor's report"
            jq -r '[.[] | select(.type == "result")][-1].result // "(no report)" | .[0:12000]' "$EXEC"
            echo
            echo "## Tool calls refused"
            jq -r '[.[] | select(.type == "result")][-1].permission_denials // []
                   | .[] | "- \(.tool_name): \(.tool_input | tostring | .[0:200])"' "$EXEC"
          } | tee -a "$GITHUB_STEP_SUMMARY" || echo "could not read $EXEC"
      - name: The plan
        if: always()
        run: python3 -I tools/plan.py show | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-doctor-plan
          path: ${{ env.CI_DOCTOR_PLAN }}
          if-no-files-found: ignore
          retention-days: 14

  apply:
    name: apply
    needs: doctor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-doctor-plan
          path: ${{ runner.temp }}/plan
      - name: Bot credentials
        env:
          APP_ID: ${{ secrets.OXROK_BOT_APP_ID }}
          KEY: ${{ secrets.OXROK_BOT_PRIVATE_KEY }}
        run: |
          sudo apt-get install -y -qq python3-cryptography >/dev/null
          d="$RUNNER_TEMP/oxrok-bot"
          install -d -m 700 "$d"
          printf '%s\n' "$APP_ID" > "$d/app-id"
          (umask 077; printf '%s\n' "$KEY" > "$d/key.pem")
      - name: Open what the doctor planned
        env:
          OXROK_BOT_DIR: ${{ runner.temp }}/oxrok-bot
        run: python3 -I tools/plan.py apply "$RUNNER_TEMP/plan" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Forget the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/oxrok-bot"
