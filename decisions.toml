# Upstream PRs that are handled without a tracking issue.
#
# verdict:
#   not-applicable  only concerns the C stack (bindings, autotools, glib,
#                   libusb event loop, C internals) and has no oxrok analogue
#   already-done    oxrok already has what the PR adds
#   wont-do         decided against; the reason says why
#   superseded      another tracked PR replaces it; the reason names it
#
# A decision is a triage result, not a judgement of the PR's author or of
# how it was written. AI authorship is never a reason (see AGENTS.md).
# To reverse one, delete the entry and track the PR with `tools/track.py add`.

