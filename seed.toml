[[item]]
title = "firmware-fx2lafw: WCID descriptors so Windows binds WinUSB without Zadig"
workstream = "firmware-build"
target = "oxrok/firmware-fx2lafw"
status = "Backlog"
upstream = ["sigrokproject/sigrok-firmware-fx2lafw#5"]
notes = """
oxrok's nusb backend needs WinUSB bound on Windows (docs/USB.md). Only helps once the firmware with the descriptors is in the device's EEPROM, or after re-enumeration with it loaded.
"""

[[item]]
title = "firmware-fx2lafw: open FX2 firmware for the Kingst LA2016 family"
workstream = "firmware-build"
target = "oxrok/firmware-fx2lafw"
status = "Backlog"
upstream = ["sigrokproject/sigrok-firmware#1"]
notes = """
Drop-in replacement for the vendor's kingst-la-01a2.fw (LGPL), tested by users with PulseView and sigrok-cli. Upstream declined it for sigrok-firmware (binaries only) and pointed at fx2lafw. Removes the FX2 half of the extraction (the FPGA bitstreams still come from KingstVIS) and documents the USB protocol for the emulator model.
"""

# --- bug-check (oxrok) ----------------------------------------------------------

[[item]]
title = "usb: devices on bus 0 (macOS) are rejected"
workstream = "bug-check"
target = "oxrok/oxrok"
status = "Backlog"
upstream = ["sigrokproject/libsigrok#295"]
notes = """
libusb on macOS reports bus 0. oxrok's conn parser has the same rejection: src/usb/mod.rs `(Ok(bus @ 1..), Ok(addr @ 1..))`. Check what the nusb backend reports for bus numbers on macOS and Windows (nusb_backend.rs sets `bus = 0`).
"""

[[item]]
title = "hid: macOS DevSrvsID paths"
workstream = "bug-check"
target = "oxrok/oxrok"
status = "Backlog"
upstream = ["sigrokproject/libsigrok#290"]
notes = """
hidapi on Apple Silicon returns `DevSrvsID:<id>` paths; libsigrok's path parser rejects them and HID meters (Brymen) vanish. Check oxrok's HID layer handles the format.
"""

[[item]]
title = "rdtech-dps: RD6006 reads inf (multipliers never set)"
workstream = "bug-check"
target = "oxrok/oxrok"
status = "Backlog"
upstream = ["sigrokproject/libsigrok#283"]
notes = """
In C, rdtech_dps_update_range returns early for single-range models, so the multipliers stay 0. oxrok ports update_range closely (src/drivers/rdtech_dps/protocol.rs); add an emulator case for a single-range RD model.
"""

[[item]]
title = "kingst-la2016: stream mode stalls at low data rates (LA1010)"
workstream = "bug-check"
target = "oxrok/oxrok"
status = "Backlog"
upstream = ["sigrokproject/libsigrok#320"]
notes = """
Captures hang ~0.5 s in with few channels or low rates on stream-only models. oxrok has stream mode (`continuous=on`); check whether the same condition applies and port the fix.
"""

[[item]]
title = "center-3xx: recover from a lost packet; honour --channels"
workstream = "bug-check"
target = "oxrok/oxrok"
status = "Backlog"
upstream = ["sigrokproject/libsigrok#300", "sigrokproject/libsigrok#302"]
notes = """
A momentary RS232 loss stops streaming until restart; #302 re-requests data on a response timeout. #300 also fixes `--channels` being ignored (all four channels always shown).
"""

[[item]]
title = "input/vcd: crafted files and maxchannels"
workstream = "bug-check"
target = "oxrok/oxrok"
status = "Backlog"
upstream = ["sigrokproject/libsigrok#312", "sigrokproject/libsigrok#289"]
notes = """
#312: a crafted VCD writes past the feed queue buffer in C. Rust bounds-checks, but an out-of-range index would still panic: add the reproducer as a test and make sure it is an error, not a panic. #289: maxchannels=0 crashes PulseView; oxrok treats 0 as unlimited (src/formats/input/vcd.rs), so only add a case.
"""

[[item]]
title = "demo: wide incremental samples and repeated stops"
workstream = "bug-check"
target = "oxrok/oxrok"
status = "Backlog"
upstream = ["sigrokproject/libsigrok#319"]
notes = """
C advanced one byte per wide sample and could emit END twice. oxrok's demo is a rewrite with a stop flag; check logic_unitsize > 1 output and repeated stop requests.
"""

[[item]]
title = "hameg-hmo: R&S RTM/RTB digital channel state and capability flags"
workstream = "bug-check"
target = "oxrok/oxrok"
status = "Backlog"
upstream = ["sigrokproject/libsigrok#281", "sigrokproject/libsigrok#259"]
notes = """
#281: RTM3004 hangs on `:LOG%d:STAT?`; RTM/RTB use `:DIG%d:PROB:ENAB?`. #259: R&S scopes can't enable single logic channels (some not pods), plus a C sr_analog_init ordering bug (check that oxrok doesn't have an equivalent).
"""

