# Tracking of upstream sigrok work for oxrok. Read by tools/track.py.

owner = "oxrok"
# All tracking issues live here; the Target field says where the work lands.
tracking_repo = "oxrok/oxrok"
project_title = "Upstream intake"
# Set by `tools/track.py setup` once the project exists.
project_number = 1

# Closed, unmerged upstream PRs older than this are not offered by intake.
# Upstream's GitHub repos are read-only mirrors: most older closed PRs were
# applied through the mailing list, and oxrok ports upstream master.
closed_since = "2026-01-01"

# Project field values. Changing these needs `tools/track.py setup` again.
statuses = ["Triage", "Backlog", "In progress", "Done", "Won't do"]
workstreams = [
  "tooling",
  "firmware-build",
  "bug-check",
  "model",
  "driver-rework",
  "new-driver",
  "input-format",
]
targets = ["oxrok/oxrok", "oxrok/oxrok-util", "oxrok/firmware-fx2lafw"]

# The "Maintenance" project (org project #2). Set by `tools/board.py setup`.
maintenance_project_number = 2
areas = ["ci", "docs", "deps", "security", "release"]

# Tables below this point: plain keys after them would belong to the last table.

# The org's repositories the maintenance tools work on. `path` is the local
# checkout, relative to this repo or absolute; `ci` the workflow whose runs
# ci.py reads; `checks` the job names the main-branch ruleset requires
# (tools/rulesets.py), as they appear on a pull request.
[[repo]]
name = "oxrok/oxrok"
path = "../../oxrok"
ci = "CI"
checks = [
  "fmt and clippy",
  "licenses",
  "msrv",
  "test (ubuntu-latest)",
  "test (macos-latest)",
  "test (windows-latest)",
  "changes",
  "python decoders (python 1/3)",
  "python decoders (python 2/3)",
  "python decoders (python 3/3)",
  "python decoders (rustpython 1/2)",
  "python decoders (rustpython 2/2)",
  "python decoders (clippy)",
]

[[repo]]
name = "oxrok/oxrok-ui"
path = "../../ui"
ci = "CI"
checks = [
  "check (ubuntu-latest)",
  "check (macos-latest)",
  "check (windows-latest)",
  "oxrok (ubuntu-latest)",
  "oxrok (macos-latest)",
]

[[repo]]
name = "oxrok/oxrok-website"
path = "../../website"
ci = "Build and deploy"
checks = ["build"]

[[repo]]
name = "oxrok/vusb"
path = "../../vusb"
ci = "CI"
checks = [
  "check (ubuntu-latest)",
  "check (macos-latest)",
  "check (windows-latest)",
  "licenses",
]

[[repo]]
name = "oxrok/management"
path = "."
ci = "check"
checks = ["check"]

# Upstream repos watched by intake, and where their work usually lands.
[[upstream]]
repo = "sigrokproject/libsigrok"
target = "oxrok/oxrok"

[[upstream]]
repo = "sigrokproject/sigrok-util"
target = "oxrok/oxrok-util"

[[upstream]]
repo = "sigrokproject/sigrok-firmware-fx2lafw"
target = "oxrok/firmware-fx2lafw"

[[upstream]]
repo = "sigrokproject/sigrok-firmware"
target = "oxrok/firmware-fx2lafw"
